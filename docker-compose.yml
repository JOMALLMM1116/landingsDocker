services:
  landing1:
    build: ./landing1
    image: landing1:1.0
    container_name: landing1-container
    restart: unless-stopped
    networks:
      - web

  landing2:
    build: ./landing2
    image: landing2:1.0
    container_name: landing2-container
    restart: unless-stopped
    networks:
      - web

  proxy:
    image: nginx:alpine
    container_name: proxy-container
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - landing1
      - landing2
    networks:
      - web

networks:
  web:
    driver: bridge
