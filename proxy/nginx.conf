server {
    listen 80;
    server_name jomadev.online www.jomadev.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    server_name devquetzal.online www.devquetzal.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name jomadev.online www.jomadev.online;

    ssl_certificate /etc/letsencrypt/live/jomadev.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jomadev.online/privkey.pem;

    location / {
        proxy_pass http://landing1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name devquetzal.online www.devquetzal.online;

    ssl_certificate /etc/letsencrypt/live/devquetzal.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devquetzal.online/privkey.pem;

    location / {
        proxy_pass http://landing2;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}
